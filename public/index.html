<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instant Family Video Chat - Turbo Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            height: 100vh;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111827;
            color: #ffffff;
        }

        @keyframes floatUp {
            0% { transform: translateY(0px) scale(0.8); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.4); opacity: 0; }
        }
        .floating-like {
            position: absolute;
            animation: floatUp 1.5s ease-out forwards;
            pointer-events: none;
            font-size: 24px;
            z-index: 50;
        }
        @keyframes buzzEffect {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .buzz-animation {
            animation: buzzEffect 0.4s ease-in-out;
            border: 3px solid #f87171 !important;
        }

        #video-grid {
            display: grid;
            gap: 6px;
            width: 100%;
            height: calc(100vh - 120px);
            height: calc(100dvh - 120px);
            padding: 6px;
            box-sizing: border-box;
            align-content: center;
            justify-content: center;
        }

        .layout-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
        .layout-2 { grid-template-columns: 1fr; grid-template-rows: repeat(2, 1fr); }
        .layout-3, .layout-4 { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); }
        .layout-5 { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr); }

        .video-card {
            position: relative;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #374151;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translateZ(0); /* Hardware acceleration */
        }

        .video-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: translateZ(0);
        }
    </style>
</head>
<body class="flex flex-col justify-between items-center" onload="autoJoinRoom()">
    
    <!-- Top Bar with Status -->
    <div class="w-full flex justify-between items-center px-4 py-2.5 bg-gray-800/90 border-b border-gray-700 backdrop-blur z-20">
        <div class="flex items-center gap-2">
            <span class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
            <h1 class="text-xs font-bold text-emerald-400 tracking-wide uppercase">Family Line (Turbo)</h1>
        </div>
        <div id="room-status" class="text-[10px] text-gray-400 font-medium">⚡ Ultra-Fast Mode</div>
    </div>

    <!-- No-Scroll Dynamic Video Grid -->
    <div id="video-grid" class="layout-1">
        <!-- Local Video Container with Mirror Effect -->
        <div id="local-container" class="video-card">
            <video id="localVideo" autoplay muted playsinline style="transform: scaleX(-1);"></video>
            <div class="absolute bottom-2 left-2 bg-black/70 px-2 py-0.5 text-[10px] rounded backdrop-blur">You</div>
        </div>
    </div>

    <!-- Floating Likes Overlay Container -->
    <div id="likes-container" class="absolute inset-0 pointer-events-none overflow-hidden"></div>

    <!-- Bottom Control Toolbar -->
    <div class="w-full bg-gray-900/95 border-t border-gray-800 py-3 px-4 flex justify-center items-center gap-2 z-20 backdrop-blur">
        <button onclick="toggleMic()" id="mic-btn" class="flex-1 max-w-[75px] bg-gray-800 hover:bg-gray-700 active:scale-95 py-2.5 rounded-xl text-[11px] font-semibold transition flex flex-col items-center gap-1 border border-gray-700">
            <span>🎤</span> Mute
        </button>
        <button onclick="toggleCam()" id="cam-btn" class="flex-1 max-w-[75px] bg-gray-800 hover:bg-gray-700 active:scale-95 py-2.5 rounded-xl text-[11px] font-semibold transition flex flex-col items-center gap-1 border border-gray-700">
            <span>📹</span> Cam Off
        </button>
        <button onclick="switchCamera()" id="flip-btn" class="flex-1 max-w-[75px] bg-blue-600/80 hover:bg-blue-600 active:scale-95 py-2.5 rounded-xl text-[11px] font-semibold transition flex flex-col items-center gap-1 border border-blue-500">
            <span>🔄</span> Flip
        </button>
        <button onclick="sendLike()" class="flex-1 max-w-[75px] bg-pink-600/80 hover:bg-pink-600 active:scale-95 py-2.5 rounded-xl text-[11px] font-semibold transition flex flex-col items-center gap-1 border border-pink-500">
            <span>❤️</span> Love
        </button>
        <button onclick="endCall()" class="flex-1 max-w-[75px] bg-red-600 hover:bg-red-500 active:scale-95 py-2.5 rounded-xl text-[11px] font-bold transition flex flex-col items-center gap-1 border border-red-500 shadow-lg shadow-red-900/30">
            <span>📞</span> End
        </button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let localStream;
        let peers = {}; 
        let candidateQueues = {}; 
        const roomId = "family-main-room";
        let useFrontCamera = true;

        // Optimized STUN configuration with ICE transport policy for speed
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ],
            iceTransportPolicy: 'all',
            bundlePolicy: 'max-bundle',
            rtcpMuxPolicy: 'require'
        };

        async function autoJoinRoom() {
            try {
                await setupCameraStream();
                socket.emit('join-room', roomId);
            } catch (error) {
                console.error('Media access error:', error);
                alert('Could not access camera or microphone. Please check permissions.');
            }
        }

        async function setupCameraStream() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }

            // TURBO SPEED CONSTRAINTS: Light resolution (480p at 20fps) to ensure zero lag on slow internet
            const constraints = {
                video: { 
                    facingMode: useFrontCamera ? 'user' : 'environment',
                    width: { ideal: 640, max: 1280 },
                    height: { ideal: 480, max: 720 },
                    frameRate: { ideal: 20, max: 30 }
                },
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                }
            };

            localStream = await navigator.mediaDevices.getUserMedia(constraints);
            document.getElementById('localVideo').srcObject = localStream;

            for (let userId in peers) {
                const pc = peers[userId];
                const senders = pc.getSenders();
                const videoTrack = localStream.getVideoTracks()[0];
                const audioTrack = localStream.getAudioTracks()[0];

                senders.forEach(sender => {
                    if (sender.track && sender.track.kind === 'video' && videoTrack) {
                        sender.replaceTrack(videoTrack);
                    }
                    if (sender.track && sender.track.kind === 'audio' && audioTrack) {
                        sender.replaceTrack(audioTrack);
                    }
                });
            }
        }

        async function switchCamera() {
            useFrontCamera = !useFrontCamera;
            try {
                await setupCameraStream();
            } catch (e) {
                console.error("Error switching camera:", e);
                useFrontCamera = !useFrontCamera;
            }
        }

        function toggleMic() {
            const audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) {
                audioTrack.enabled = !audioTrack.enabled;
                const btn = document.getElementById('mic-btn');
                btn.innerHTML = audioTrack.enabled ? '<span>🎤</span> Mute' : '<span>🎤</span> Unmute';
                btn.classList.toggle('bg-red-900/60', !audioTrack.enabled);
                btn.classList.toggle('border-red-500', !audioTrack.enabled);
            }
        }

        function toggleCam() {
            const videoTrack = localStream.getVideoTracks()[0];
            if (videoTrack) {
                videoTrack.enabled = !videoTrack.enabled;
                const btn = document.getElementById('cam-btn');
                btn.innerHTML = videoTrack.enabled ? '<span>📹</span> Cam Off' : '<span>📹</span> Cam On';
                btn.classList.toggle('bg-red-900/60', !videoTrack.enabled);
                btn.classList.toggle('border-red-500', !videoTrack.enabled);
            }
        }

        function endCall() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            socket.disconnect();
            window.close();
            window.location.href = "about:blank";
        }

        function triggerBuzz(targetId) {
            socket.emit('buzz-user', targetId);
        }

        socket.on('buzzed', (data) => {
            const container = document.getElementById(`container-${data.sender}`) || document.getElementById('local-container');
            container.classList.add('buzz-animation');
            if (navigator.vibrate) {
                navigator.vibrate([300, 100, 300, 100, 300]);
            }
            setTimeout(() => container.classList.remove('buzz-animation'), 1000);
        });

        function sendLike() {
            socket.emit('send-like', roomId);
            showFloatingLike();
        }

        socket.on('receive-like', () => {
            showFloatingLike();
        });

        function showFloatingLike() {
            const likesContainer = document.getElementById('likes-container');
            const heart = document.createElement('div');
            heart.className = 'floating-like';
            heart.textContent = '❤️';
            heart.style.left = `${Math.random() * 80 + 10}%`;
            heart.style.bottom = '80px';
            likesContainer.appendChild(heart);
            setTimeout(() => heart.remove(), 1500);
        }

        function updateVideoLayout() {
            const grid = document.getElementById('video-grid');
            const totalCards = grid.children.length;
            
            grid.className = '';
            if (totalCards <= 1) grid.classList.add('layout-1');
            else if (totalCards === 2) grid.classList.add('layout-2');
            else if (totalCards === 3 || totalCards === 4) grid.classList.add('layout-3');
            else grid.classList.add('layout-5');
        }

        // --- WebRTC Signaling & Turbo Peer Sync ---
        socket.on('existing-users', async (users) => {
            for (const userId of users) {
                await createPeerConnection(userId, true);
            }
        });

        socket.on('user-joined', (userId) => {
            console.log(`New user joined: ${userId}`);
        });

        socket.on('offer', async (data) => {
            let pc = peers[data.sender];
            if (!pc) {
                pc = await createPeerConnection(data.sender, false);
            }
            await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
            processQueuedCandidates(data.sender);
            
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            socket.emit('answer', { target: data.sender, answer: answer });
        });

        socket.on('answer', async (data) => {
            const pc = peers[data.sender];
            if (pc) {
                await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
                processQueuedCandidates(data.sender);
            }
        });

        socket.on('ice-candidate', async (data) => {
            const pc = peers[data.sender];
            if (pc) {
                if (pc.remoteDescription && pc.remoteDescription.type) {
                    await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
                } else {
                    if (!candidateQueues[data.sender]) candidateQueues[data.sender] = [];
                    candidateQueues[data.sender].push(data.candidate);
                }
            }
        });

        async function processQueuedCandidates(userId) {
            const pc = peers[userId];
            const queue = candidateQueues[userId];
            if (pc && queue && queue.length > 0) {
                while (queue.length > 0) {
                    const candidate = queue.shift();
                    await pc.addIceCandidate(new RTCIceCandidate(candidate));
                }
            }
        }

        socket.on('user-disconnected', (userId) => {
            if (peers[userId]) {
                peers[userId].close();
                delete peers[userId];
            }
            delete candidateQueues[userId];
            const el = document.getElementById(`container-${userId}`);
            if (el) {
                el.remove();
                updateVideoLayout();
            }
        });

        async function createPeerConnection(userId, isInitiator) {
            if (peers[userId]) return peers[userId];

            // Use the optimized rtcConfig for fastest bundling
            const pc = new RTCPeerConnection(rtcConfig);
            peers[userId] = pc;
            candidateQueues[userId] = [];

            if (localStream) {
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            }

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', { target: userId, candidate: event.candidate });
                }
            };

            pc.ontrack = (event) => {
                let container = document.getElementById(`container-${userId}`);
                if (!container) {
                    container = document.createElement('div');
                    container.id = `container-${userId}`;
                    container.className = 'video-card';
                    
                    const video = document.createElement('video');
                    video.id = `video-${userId}`;
                    video.autoplay = true;
                    video.playsInline = true;
                    video.srcObject = event.streams[0];
                    video.play().catch(e => console.log("Autoplay handled:", e));

                    const label = document.createElement('div');
                    label.className = 'absolute bottom-2 left-2 bg-black/70 px-2 py-0.5 text-[10px] rounded flex items-center justify-between w-[95%] backdrop-blur';
                    label.innerHTML = `<span>Family Member</span> <button onclick="triggerBuzz('${userId}')" class="bg-red-500/90 px-2 py-0.5 rounded text-[9px] font-bold active:scale-95 transition">🔔 Buzz</button>`;

                    container.appendChild(video);
                    container.appendChild(label);
                    document.getElementById('video-grid').appendChild(container);
                    
                    updateVideoLayout();
                } else {
                    const video = document.getElementById(`video-${userId}`);
                    if (video && video.srcObject !== event.streams[0]) {
                        video.srcObject = event.streams[0];
                        video.play().catch(e => console.log("Autoplay handled:", e));
                    }
                }
            };

            if (isInitiator) {
                // Optimized low-latency offer creation with voice/video bundle hints
                const offer = await pc.createOffer({
                    offerToReceiveAudio: true,
                    offerToReceiveVideo: true
                });
                await pc.setLocalDescription(offer);
                socket.emit('offer', { target: userId, offer: offer });
            }

            return pc;
        }
    </script>
</body>
</html>
